# .omp/config.yml - Project Configuration

# Orchestrator & role mappings
modelRoles:
  default: anthropic/claude-sonnet-5 # main orchestrator session model
  review: anthropic/claude-sonnet-5 # @review role

# Subagent overrides (win over agent frontmatter)
task:
  agentModelOverrides:
    task: google-antigravity/gemini-3.6-flash # code-writing subagent
    sonic: google-antigravity/gemini-3.6-flash # mechanical worker
    reviewer: anthropic/claude-sonnet-5 # code review subagent
